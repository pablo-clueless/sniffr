<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sniffr — React</title>

    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19",
          "react/jsx-runtime": "https://esm.sh/react@19/jsx-runtime",
          "react-dom/client": "https://esm.sh/react-dom@19/client",
          "zustand/vanilla": "https://esm.sh/zustand@5/vanilla",
          "zod": "https://esm.sh/zod@4"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <script type="module">
      import { createElement as h, useEffect, useState } from "react";
      import { createRoot } from "react-dom/client";

      import { sniffr } from "../dist/index.js";
      import { SniffrOverlay, useSniffr } from "../dist/react.js";
      import { ENDPOINT, page, schemas } from "./shared.js";

      page("sniffr — React");

      // interceptors only: <SniffrOverlay /> owns the panel, which is the same
      // split the README recommends for Next.js
      sniffr({ overlay: false, schemas });

      function App() {
        const state = useSniffr();
        const [calls, setCalls] = useState(0);

        const load = async () => {
          await fetch(ENDPOINT);
          setCalls((n) => n + 1);
        };

        useEffect(() => {
          void load();
        }, []);

        const endpoints = Object.values(state.models);
        const breaking = endpoints
          .flatMap((m) => m.changes)
          .filter((c) => c.severity === "breaking");

        return h(
          "main",
          null,
          h("h1", null, "sniffr — React"),
          h(
            "p",
            null,
            "Fetches ",
            h("code", null, ENDPOINT),
            " and diffs the response against a zod schema. Drag the pill to any corner.",
          ),
          h(
            "p",
            null,
            `${calls} request(s) · ${endpoints.length} endpoint(s) · ${breaking.length} breaking`,
          ),
          h("button", { type: "button", onClick: () => void load() }, "Fetch again"),
          h(SniffrOverlay),
        );
      }

      createRoot(document.getElementById("root")).render(h(App));
    </script>
  </body>
</html>
