name: Security

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  schedule:
    # Monday 06:00 UTC, so newly disclosed advisories surface without a push
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write # required to upload SARIF to code scanning

jobs:
  snyk:
    name: Snyk
    runs-on: ubuntu-latest
    # SNYK_TOKEN is not exposed to pull requests from forks, so the step would
    # fail for reasons the contributor cannot fix. Those PRs still run CI.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      # Dependencies. Only high/critical fail the build; everything else is
      # reported to code scanning without blocking a merge.
      - name: Snyk Open Source
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects --severity-threshold=high --sarif-file-output=snyk-oss.sarif

      - name: Upload Open Source results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-oss.sarif
          category: snyk-oss

      # Static analysis of our own source. `|| true` keeps a finding from
      # blocking the merge; the SARIF upload is what surfaces it.
      - name: Snyk Code
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --severity-threshold=high --sarif-file-output=snyk-code.sarif || true

      - name: Upload Snyk Code results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code
