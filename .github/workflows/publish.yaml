name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # trusted publishing exchanges this for a short-lived npm token, and it is
      # what signs the provenance statement
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      # trusted publishing needs npm >= 11.5.1; do not rely on whatever ships
      # with the runner's Node
      - name: Use a recent npm
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

      - name: Verify the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package version $PKG" >&2
            exit 1
          fi

      # `pnpm build` already ends in scripts/check-bundle.mjs, which enforces the
      # framework-free core and the rest of the bundle contract.

      # npm, not pnpm: trusted publishing is an npm feature, and npm performs the
      # OIDC exchange itself. No NODE_AUTH_TOKEN — supplying one would take
      # precedence over the OIDC credential.
      - name: Publish
        run: npm publish --provenance --access public
