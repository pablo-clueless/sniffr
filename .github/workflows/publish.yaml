name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # trusted publishing exchanges this for a short-lived npm credential, and
      # it is what signs the provenance statement
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      # trusted publishing needs npm >= 11.5.1 and node >= 22.14.0; do not rely
      # on whatever ships with the runner
      - name: Use a recent npm
        run: npm install -g npm@latest

      # Says outright whether OIDC produced a credential. `npm whoami` failing
      # here means trusted publishing is not in effect and the publish will fall
      # back to NODE_AUTH_TOKEN.
      - name: Report auth state
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "npm      $(npm -v)"
          echo "node     $(node -v)"
          echo "oidc url ${ACTIONS_ID_TOKEN_REQUEST_URL:+present}${ACTIONS_ID_TOKEN_REQUEST_URL:-MISSING}"
          echo "token    ${NODE_AUTH_TOKEN:+present}${NODE_AUTH_TOKEN:-absent}"
          echo "--- .npmrc ---"
          sed 's/\(_authToken=\).*/\1<redacted>/' ~/.npmrc 2>/dev/null || echo "(none)"
          echo "--- identity ---"
          npm whoami || echo "npm whoami failed — no usable credential"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

      - name: Verify the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package version $PKG" >&2
            exit 1
          fi

      # `pnpm build` already ends in scripts/check-bundle.mjs, which enforces the
      # framework-free core and the rest of the bundle contract.

      # npm, not pnpm: trusted publishing is an npm feature and npm performs the
      # OIDC exchange itself. NODE_AUTH_TOKEN stays as a fallback — npm prefers
      # OIDC when a trusted publisher is configured, so keeping it costs nothing
      # and is what allows the very first publish, before the package exists and
      # a trusted publisher can be attached to it.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
