name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # required for OIDC
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never use caching in release builds

      # trusted publishing needs npm >= 11.5.1 and node >= 22.14.0
      - name: Use a recent npm
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

      - name: Verify the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package version $PKG" >&2
            exit 1
          fi

      # `pnpm build` already ends in scripts/check-bundle.mjs, which enforces the
      # framework-free core and the rest of the bundle contract.

      # No NODE_AUTH_TOKEN and no --provenance: trusted publishing supplies the
      # credential over OIDC and attaches provenance on its own. --access public
      # stays because a scoped package is private on first publish otherwise.
      - name: Publish
        run: npm publish --access public
